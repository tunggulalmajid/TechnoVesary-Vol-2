name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # TAHAP 1: CI - Backend (Lint Pint, PHPStan, Database Testing, Pest Test)
  # =========================================================================
  backend:
    name: Backend (lint, static analysis, test)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, dom, curl, zip, fileinfo, bcmath
          tools: composer:v2
          coverage: none

      - name: Cache composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear
          mkdir -p public/build
          echo '{}' > public/build/manifest.json

      - name: Check code style (Pint)
        run: vendor/bin/pint --test --parallel

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Migrate & seed database
        run: php artisan migrate:fresh --seed --force

      - name: Run test suite
        run: php artisan test

  # =========================================================================
  # TAHAP 2: CI - Frontend (Types, Lint, Asset Build)
  # =========================================================================
  frontend:
    name: Frontend (types, lint, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run types:check

      - name: Lint & format check
        run: npm run check

      - name: Build assets
        run: npm run build

  # =========================================================================
  # TAHAP 3: CD - Deploy ke Server VPS (Hanya jika CI Lolos & di branch main)
  # =========================================================================
  deploy:
    name: Deploy to server
    needs: [backend, frontend]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Prepare environment file
        env:
          RAW_ENV: ${{ secrets.PRODUCTION_ENV || secrets.PRODUCTION_ENV_B64 }}
        run: |
          if [ -z "$RAW_ENV" ]; then
            echo "::error::Secret PRODUCTION_ENV tidak ditemukan. Pastikan sudah menambahkan secret PRODUCTION_ENV di GitHub Secrets."
            exit 1
          fi
          # Mendukung tempel teks .env secara langsung (plaintext) maupun format base64,
          # serta membersihkan karakter Windows carriage return (\r) agar kompatibel dengan Linux server.
          if echo "$RAW_ENV" | grep -q "="; then
            printf '%s\n' "$RAW_ENV" | tr -d '\r' | base64 -w 0 > env.b64
          else
            printf '%s' "$RAW_ENV" | tr -d '\r\n ' > env.b64
          fi
          echo "ENV_B64=$(cat env.b64)" >> "$GITHUB_ENV"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          ENV_B64: ${{ env.ENV_B64 }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: ENV_B64
          script: |
            set -e
            cd /opt/revalue
            git fetch --prune origin main
            git reset --hard origin/main
            printf '%s' "$ENV_B64" | base64 -d > .env
            chmod 600 .env
            chmod +x ./deploy/deploy.sh
            ./deploy/deploy.sh "${{ github.sha }}"
